[package]
name = "swc_plugin_build_conditions"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = "symbols"

[dependencies]
serde = "1"
serde_json = "1"
# Версия swc_core должна быть совместима с plugin runner'ом swc
# целевого бандлера (rspack / swc)
swc_core = { version = "46", features = ["ecma_plugin_transform"] }

[dev-dependencies]
criterion = "0.5"
# Дополнительные фичи только для тестов и бенчей (парсер синтетических
# исходников); на релизную wasm-сборку не влияют
swc_core = { version = "46", features = ["ecma_plugin_transform", "ecma_parser"] }
testing = "17.0.0"

[[bench]]
name = "transform"
harness = false

# Релизный профиль заточен под размер wasm-артефакта (lto, opt-level = "s");
# бенчам нужна скорость сборки и репрезентативный опткод
[profile.bench]
lto = false
codegen-units = 16
opt-level = 3

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(swc_ast_unknown)'] }
