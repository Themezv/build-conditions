[package]
name = "swc_plugin_build_conditions"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = "symbols"

[dependencies]
serde = "1"
serde_json = "1"
# The swc_core version must be compatible with the swc plugin runner
# of the target bundler (rspack / swc)
swc_core = { version = "46", features = ["ecma_plugin_transform"] }

[dev-dependencies]
criterion = "0.5"
# Extra features for tests and benches only (parsing synthetic sources);
# they do not affect the release wasm build
swc_core = { version = "46", features = ["ecma_plugin_transform", "ecma_parser"] }
testing = "17.0.0"

[[bench]]
name = "transform"
harness = false

# The release profile is tuned for wasm artifact size (lto, opt-level = "s");
# benches need build speed and representative optimized code
[profile.bench]
lto = false
codegen-units = 16
opt-level = 3

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(swc_ast_unknown)'] }
